name: Windows 自动验证
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      # 官方 release 页面已核对完整修订；不跟随可变标签。
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Windows 集成测试会同时启动多个 PowerShell／Node 进程，串行运行避免抢占启动等待预算。
      - run: npm run test:ci
      - name: 隔离安装与升级验证
        run: |
          ./tests/installer-flow.ps1
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File ./tests/installer-flow.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 隔离快捷方式启动验证
        run: ./tests/shortcut-flow.ps1
      - run: npm pack --dry-run --json --ignore-scripts
